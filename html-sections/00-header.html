<header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-lg transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

        <!-- Brand Logo from logo yellow.svg -->
        <a href="/" class="flex items-center gap-3">
            <img src="logot-yellow-light.svg" alt="Montreal Polymers Inc." class="h-10 w-auto">
        </a>

        <!-- Desktop Nav Links -->
        <nav class="hidden lg:flex items-center space-x-8 text-sm font-bold text-slate-300 tracking-wide">
            <a href="/" class="text-gold-400 border-b-2 border-gold-500 pb-0.5">Home</a>
            <a href="/scrap-pickup/" class="text-slate-300 hover:text-gold-400 transition-colors">Scrap Taxi</a>
            <a href="/polymers/" class="text-slate-300 hover:text-gold-400 transition-colors flex items-center gap-1">
                <span>Polymers</span>
                <span class="text-[10px] bg-slate-800 text-gold-400 px-1.5 py-0.5 rounded font-mono uppercase border border-slate-700">PVC</span>
            </a>
            <a href="/products/" class="text-slate-300 hover:text-gold-400 transition-colors">The Goods</a>
            <a href="/services/" class="text-slate-300 hover:text-gold-400 transition-colors">Shred &amp; Grind</a>
            <a href="/team/" class="text-slate-300 hover:text-gold-400 transition-colors">The Crew</a>
        </nav>

        <!-- CTA Actions -->
        <div class="hidden sm:flex items-center space-x-3">
            <a href="/scrap-pickup/" class="px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-900 bg-gold-500 hover:bg-gold-400 transition-all shadow-gold-glow flex items-center gap-2">
                <span>Book Scrap Pickup</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </a>
        </div>

        <!-- Mobile Menu Toggle Button -->
        <div class="lg:hidden flex items-center gap-2">
            <a href="/scrap-pickup/" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gold-500 text-slate-900">Pickup</a>
            <button id="mobileMenuBtn" class="p-2 rounded-lg text-slate-300 hover:bg-slate-800 focus:outline-none">
                <i data-lucide="menu" id="menuIcon" class="w-6 h-6"></i>
            </button>
        </div>

    </div>

    <!-- Mobile Drawer -->
    <div id="mobileDrawer" class="hidden lg:hidden bg-slate-900 border-t border-slate-800 px-6 py-5 space-y-3 font-semibold text-sm">
        <a href="/" class="block py-1 text-gold-400 font-bold">Home</a>
        <a href="/scrap-pickup/" class="block py-1 text-slate-300 hover:text-gold-400">Scrap Taxi</a>
        <a href="/polymers/" class="block py-1 text-slate-300 hover:text-gold-400">Polymers</a>
        <a href="/products/" class="block py-1 text-slate-300 hover:text-gold-400">The Goods</a>
        <a href="/services/" class="block py-1 text-slate-300 hover:text-gold-400">Shred &amp; Grind</a>
        <a href="/team/" class="block py-1 text-slate-300 hover:text-gold-400">The Crew</a>
        <div class="pt-3 border-t border-slate-800 flex flex-col gap-2">
            <a href="/scrap-pickup/" class="block text-center py-2.5 bg-gold-500 text-slate-900 font-bold rounded-xl text-xs uppercase tracking-wider shadow-gold-glow">
                Book Scrap Pickup
            </a>
        </div>
    </div>
</header>
